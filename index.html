<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tukats Musical - Batucada Interactiva</title>
    <!-- Motor d'àudio Tone.js per a sincronització professional -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        :root {
            --primary: #ffcc00;
            --secondary: #1a472a; 
            /* Colors basats en Tukats Bolos */
            --bg-color: #2b5a27; 
            --bg-gradient: linear-gradient(135deg, #2b5a27 0%, #1e3c1a 100%);
            --card-bg: rgba(255, 255, 255, 0.96);
        }

        body {
            background: var(--bg-color);
            background: var(--bg-gradient);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            user-select: none;
            overflow-x: hidden;
        }

        .header-container {
            text-align: center;
            margin-bottom: 25px;
            z-index: 10;
        }

        /* Estil per al Logo */
        .logo-img {
            max-width: 180px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        h1 { 
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: 900;
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            text-shadow: 3px 3px 0px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: #ffcc00; /* Groc per destacar com a la web de bolos */
            font-size: 0.95rem;
            margin-top: 8px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Quadrícula d'Instruments */
        .batucada-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 92%;
            max-width: 750px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 35px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 600px) {
            .batucada-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .logo-img { max-width: 130px; }
        }

        /* Estil dels botons */
        .instrumento {
            background: var(--card-bg);
            border: 4px solid transparent;
            border-radius: 22px;
            padding: 30px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            color: var(--secondary);
        }

        .instrumento:hover {
            transform: translateY(-6px);
            background: white;
        }

        /* Animació d'espera (Quantització) */
        .instrumento.waiting {
            animation: sync-blink 0.4s infinite;
            filter: grayscale(0.4) brightness(0.8);
        }

        @keyframes sync-blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.97); }
        }

        /* Estat Actiu */
        .instrumento.active {
            border-color: var(--primary);
            background-color: white;
            transform: scale(1.06);
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.5);
        }

        .icon { font-size: 45px; margin-bottom: 12px; }
        .label { font-weight: 900; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }

        /* Pantalla d'Inici / Càrrega */
        #overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.8s ease;
        }

        #start-btn {
            padding: 22px 70px;
            font-size: 24px;
            cursor: not-allowed;
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.4);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 100px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s;
        }

        #start-btn.ready {
            cursor: pointer;
            background: var(--primary);
            color: var(--secondary);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        #start-btn.ready:hover {
            transform: scale(1.08);
            filter: brightness(1.1);
        }

        .loading-text {
            margin-top: 25px;
            font-weight: 700;
            color: #a8d5a2;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Benvinguda -->
    <div id="overlay">
        <!-- Substitueix "logo.png" pel camí del teu fitxer de logo real -->
        <img src="logo.png" alt="Tukats Logo" class="logo-img" onerror="this.style.display='none'; document.getElementById('fallback-icon').style.display='block';">
        <div id="fallback-icon" class="icon" style="display:none; font-size: 100px; margin-bottom: 20px;">🥁</div>
        
        <h1 style="margin-bottom: 15px;">TUKATS MUSICAL</h1>
        <button id="start-btn" disabled>CARREGANT...</button>
        <div class="loading-text" id="loader-status">SINCRONITZANT RITMES</div>
    </div>

    <div class="header-container">
        <img src="logo.png" alt="Tukats Logo" class="logo-img" style="max-width: 120px;" onerror="this.style.display='none'">
        <h1>TUKATS MUSICAL</h1>
        <p class="subtitle">BATUCADA INTERACTIVA • 110 BPM</p>
    </div>
    
    <div class="batucada-grid">
        <div class="instrumento" id="1a"><div class="icon">🥁</div><div class="label">Surdo 1a</div></div>
        <div class="instrumento" id="2a"><div class="icon">🥁</div><div class="label">Surdo 2a</div></div>
        <div class="instrumento" id="3a"><div class="icon">🥁</div><div class="label">Surdo 3a</div></div>
        <div class="instrumento" id="Caja"><div class="icon">🥁</div><div class="label">Caixa</div></div>
        <div class="instrumento" id="Tamborin"><div class="icon">🪘</div><div class="label">Tamborí</div></div>
        <div class="instrumento" id="Block"><div class="icon">🪵</div><div class="label">Bloc</div></div>
        <div class="instrumento" id="Agogo"><div class="icon">🔔</div><div class="label">Agogó</div></div>
        <div class="instrumento" id="Chapas"><div class="icon">✨</div><div class="label">Xapes</div></div>
        <div class="instrumento" id="Repe"><div class="icon">🪘</div><div class="label">Repe</div></div>
    </div>

    <script>
        const getUrl = (file) => {
            try {
                return new URL(file, window.location.href).href;
            } catch (e) {
                return file;
            }
        };

        const audioFiles = {
            "1a": getUrl("1a.ogg"),
            "2a": getUrl("2a.ogg"),
            "3a": getUrl("3a.ogg"),
            "Caja": getUrl("Caja.ogg"),
            "Tamborin": getUrl("Tamborin.ogg"),
            "Block": getUrl("Block.ogg"),
            "Agogo": getUrl("Agogo.ogg"),
            "Chapas": getUrl("Chapas.ogg"),
            "Repe": getUrl("Repe.ogg")
        };

        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const loaderStatus = document.getElementById('loader-status');

        const activeStates = {};
        Object.keys(audioFiles).forEach(key => activeStates[key] = false);

        Tone.Transport.bpm.value = 110;

        const players = new Tone.Players(audioFiles).toDestination();
        
        const masterLoop = new Tone.Loop((time) => {
            Object.keys(audioFiles).forEach(key => {
                const player = players.player(key);
                if (activeStates[key]) {
                    player.start(time);
                } else {
                    player.stop(time);
                }
            });
        }, "4m");

        Tone.loaded().then(() => {
            Object.keys(audioFiles).forEach(key => {
                players.player(key).loop = false;
            });
            
            startBtn.disabled = false;
            startBtn.classList.add('ready');
            startBtn.innerText = "COMENÇAR!";
            loaderStatus.innerText = "LLST PER AL RITME";
        }).catch(err => {
            loaderStatus.innerText = "ERROR EN CARREGAR ÀUDIOS";
            console.error(err);
        });

        startBtn.addEventListener('click', async () => {
            await Tone.start();
            masterLoop.start(0);
            Tone.Transport.start();
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 800);
        });

        document.querySelectorAll('.instrumento').forEach(boton => {
            boton.addEventListener('click', () => {
                const id = boton.id;
                const willEnable = !activeStates[id];

                boton.classList.add('waiting');

                Tone.Transport.scheduleOnce((time) => {
                    Tone.Draw.schedule(() => {
                        activeStates[id] = willEnable;
                        boton.classList.remove('waiting');
                        boton.classList.toggle('active', willEnable);
                    }, time);
                }, "@4m");
            });
        });
    </script>
</body>
</html>
